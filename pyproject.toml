[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bid-evaluator"
version = "0.2.0"
requires-python = ">=3.11"
description = "可追溯招投标辅助评审后端"
dependencies = [
  "pydantic==2.13.4", "SQLAlchemy==2.0.51", "alembic==1.20.0",
  "fastapi==0.133.0", "uvicorn==0.49.0", "python-multipart==0.0.32",
  "httpx==0.28.1", "python-dotenv==1.2.2", "openai==2.41.1",
  "beautifulsoup4==4.15.0", "lxml==6.1.1", "openpyxl==3.1.5",
  "markitdown==0.1.6", "pdfplumber==0.11.10", "pypdfium2==5.10.1",
]

[project.scripts]
bid-worker = "ai_bid_evaluator.worker.main:main"
bid-import = "ai_bid_evaluator.infrastructure.import_legacy:main"

[tool.setuptools.packages.find]
where = ["src"]

