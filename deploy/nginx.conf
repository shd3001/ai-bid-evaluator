server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传物是招投标材料，后端限制 50MiB；这里留出 multipart 开销。
    client_max_body_size 64m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 前端走相对路径 /api，必须与静态资源同源反代。
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 解析大文档、等待模型可能超过 60s，默认值会提前断开。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 上传大文件时不要把整个请求先缓冲到 nginx 磁盘。
        proxy_request_buffering off;
        client_body_buffer_size 1m;
    }

    # 便于内网排查：交互文档与 Schema 与 API 同源暴露。
    location = /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location /docs/ {
        proxy_pass http://api:8000/docs/;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # 带哈希的静态资源可以长缓存。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA：前端路由交给 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}